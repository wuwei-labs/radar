version: 0.1.2
author: forefy
accent: anchor
name: Missing Freeze Authority Check
description: Programs that accept token deposits without verifying the mint freeze_authority is None allow token issuers to freeze user accounts and trap deposited funds.
severity: Medium
certainty: Medium
rule: |
  for source, nodes in ast:
      try:
          nodes.find_by_names("transfer").exit_on_none()
          flagged_structs = set()
          for mint_node in nodes.find_by_names("Mint"):
              try:
                  if ".struct.fields.named[" not in mint_node.access_path:
                      continue
                  # Resolved by access path, not by counting `.parent` hops:
                  # `Box<Account<'info, Mint>>` and `Option<Box<...>>` nest
                  # deeper than a bare `Account<'info, Mint>`, so a fixed hop
                  # count put `struct_node` on the field, its `derive(Accounts)`
                  # lookup found nothing, and the wrapped mint was skipped
                  # entirely - a missed finding rather than a noisy one, and
                  # `field_node` would have carried the wrong span had it
                  # reported.
                  field_node = mint_node.owning_field()
                  struct_node = mint_node.owning_struct()
                  if field_node is None or struct_node is None:
                      continue
                  struct_node.find_chained_calls("derive", "Accounts").exit_on_none()
                  struct_node.find_by_names("TokenAccount").exit_on_none()
                  struct_node.find_by_names("freeze_authority").exit_on_value()

                  # A mint pinned with `address = ...` is not one the caller
                  # chose. This reports accepting deposits in an arbitrary
                  # token whose issuer can freeze the account; when the program
                  # names the mint, that decision was made once and
                  # deliberately, and re-checking `freeze_authority` at runtime
                  # would only reject the token the program exists to handle.
                  mint_field_path = field_node.access_path + "."
                  pinned = False
                  for candidate in nodes.find_macro_attribute_by_names("address"):
                      if candidate.access_path.startswith(mint_field_path):
                          pinned = True
                          break
                  if pinned:
                      continue

                  if struct_node.ident in flagged_structs:
                      continue
                  for function in nodes.find_all_functions():
                      try:
                          function.find_by_names("Context", struct_node.ident).exit_on_none()
                          function.find_by_names("transfer").exit_on_none()
                          function.find_by_names("freeze_authority").exit_on_value()
                          flagged_structs.add(struct_node.ident)
                          print(field_node.to_result())
                          break
                      except:
                          continue
              except:
                  continue
      except:
          continue
