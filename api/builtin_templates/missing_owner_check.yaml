version: 0.2.1
author: forefy
accent: anchor
name: Missing Owner Check
description: Deserializing or unpacking a raw account's data without verifying the account is owned by the expected program lets a caller substitute an attacker-controlled account with a compatible layout. The account's owner should be checked against the program ID, or the account should be typed as Anchor's Account<T> which validates it.
severity: Low
certainty: Low
vulnerable_example: https://github.com/Auditware/radar/blob/main/api/tests/mocks/missing_owner_check/bad/programs/missing_owner_check/src/lib.rs
rule: |
  for source, nodes in ast:
      try:
          derive_account_nodes = nodes.find_chained_calls("derive", "Accounts").exit_on_none()

          # The check only matters for a raw account whose owner Anchor does not
          # already prove. `Signer` proves itself by signature, `Program` by
          # address, and `Account<T>` validates the program owner for you.
          if not nodes.find_by_names(
              "UncheckedAccount", "AccountInfo", "AccountLoader", "SplTokenAccount"
          ):
              continue

          # The bug requires the raw account's data to actually be trusted -
          # unpacked or deserialized into a type. Merely holding an unchecked
          # account (with no data access) is what Unconstrained UncheckedAccount
          # covers; flagging every such struct here was noise.
          if not nodes.find_by_names("unpack", "try_from_slice", "try_deserialize").nodes:
              continue

          # Safe when the account's program owner is compared against a program
          # ID (`account.owner == spl_token::ID` / `== program_id`). A comparison
          # of a deserialized account's own `.owner` field against the authority
          # is a different check and does not prove program ownership.
          if nodes.find_comparisons_between("owner", "ID") or nodes.find_comparisons_between("owner", "program_id"):
              continue

          # The same check written as a method call. `owner.eq(&crate::ID)` is
          # what `require!` takes, and codebases that ban comparison operators
          # write nothing else — reading only `==` reported every one of them.
          # Still requires the argument to name a program ID: `owner.eq(&payer)`
          # compares an authority, which proves nothing about who owns the
          # account.
          # Read the expression the `owner` sits in and ask what it is compared
          # against. Scoped to that expression - the enclosing call or `require!`
          # - rather than to a node shape, because the same source reaches this
          # rule as a `method_call` when written as an `if` and as a macro token
          # stream when written inside `require!`.
          owner_checked = False
          for hit in nodes.find_by_names("owner"):
              if owner_checked:
                  break

              scope = None
              if ".method_call" in hit.access_path:
                  scope = hit.access_path.split(".method_call")[0] + ".method_call"
              elif ".macro" in hit.access_path:
                  scope = hit.access_path.split(".macro")[0] + ".macro"
              if scope is None:
                  continue

              compares = False
              names_a_program = False
              for node in nodes.find_by_access_path(scope):
                  if node.ident in ("eq", "ne"):
                      compares = True
                  if node.ident in ("ID", "program_id"):
                      names_a_program = True

              # `owner.eq(&crate::ID)` passes. The authority check written one
              # line away in the same file - `contract.owner.eq(accounts.payer
              # .key())` - names no program and stays reported.
              if compares and names_a_program:
                  owner_checked = True

          if owner_checked:
              continue

          print(derive_account_nodes.first().first().to_result())
      except:
          continue
