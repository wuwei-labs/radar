version: 0.1.3
author: forefy
accent: anchor
name: Duplicate Mutable Accounts
description: When there are two or more accounts with mutable data, a check must be in place to ensure mutation of each account is differentiated properly, to avoid unintended data modification of other accounts.
severity: Medium
certainty: Low
vulnerable_example: https://github.com/Auditware/radar/blob/main/api/tests/mocks/duplicate_mutable_accounts/bad/src/lib.rs#L18-L21
rule: |
  for source, nodes in ast:
      try:
          groups = nodes.find_chained_calls("derive", "Accounts").exit_on_none()
          constraints = nodes.find_macro_attribute_by_names("constraint")
          pins = nodes.find_macro_attribute_by_names("seeds", "address", "associated_token")

          seen_structs = []
          for group in groups:
              for derive_node in group:
                  struct_path = derive_node.access_path.split(".attrs")[0]
                  if not struct_path.endswith(".struct"):
                      continue
                  if struct_path in seen_structs:
                      continue
                  seen_structs.append(struct_path)

                  # Scope to this struct: a constraint on some other
                  # instruction's accounts says nothing about this one.
                  constrained = False
                  for constraint in constraints:
                      if constraint.access_path.startswith(struct_path + "."):
                          constrained = True
                          break
                  if constrained:
                      continue

                  # Enumerate this struct's `Account<'info, T>` fields, keyed by
                  # the inner type T. Two fields of the same T can be satisfied
                  # by one account, so a same-typed pair with nothing to tell
                  # them apart is the duplicate-mutable bug. Keying on the field
                  # type (not `#[account(mut)]`) catches the case where the
                  # accounts are mutated in the handler rather than the struct -
                  # the shape the canonical example takes.
                  by_type = {}
                  for account in nodes.find_by_names("Account"):
                      account_path = account.access_path
                      if not account_path.startswith(struct_path + ".fields.named["):
                          continue
                      # The field is resolved by access path rather than by a
                      # `.parent` hop: `Box<Account<'info, T>>` and
                      # `Option<Box<...>>` nest deeper than a bare
                      # `Account<'info, T>`, so the hop landed inside the type
                      # and `field_name` was not the field's name - which
                      # silently disabled the `.key()` guard below.
                      field_node = account.owning_field()
                      if field_node is None:
                          continue
                      field_name = field_node.ident
                      field_path = account_path.split(".ty")[0]

                      # The inner type T lives under the generic arguments; the
                      # lifetime arg carries no `.type`, so this picks out T.
                      # Scoped to this `Account` node rather than to the field's
                      # whole `.ty` subtree: the subtree yields the outermost
                      # type argument first, so `Box<Account<'info, T>>` gave
                      # `Account` - the Box's argument - for every boxed field.
                      # They then all shared one pseudo-type, any two unrelated
                      # boxed accounts in a struct looked like duplicates, and
                      # the TokenAccount/Mint exemption below never matched.
                      # Standing on the `Account` node makes the first match T
                      # at any wrapper depth.
                      # Matched strictly below this node, never on it: a boxed
                      # `Account` is itself the Box's type argument, so its own
                      # path already carries `arguments...type.path.segments`
                      # and it would answer as its own inner type.
                      inner_type = None
                      prefix = account.access_path + "."
                      for candidate in account.find_by_access_path(".arguments.angle_bracketed.args["):
                          if not candidate.access_path.startswith(prefix):
                              continue
                          relative = candidate.access_path[len(prefix):]
                          if "arguments.angle_bracketed.args[" in relative \
                             and ".type.path.segments" in relative:
                              inner_type = candidate.ident
                              break
                      if inner_type is None:
                          continue

                      # SPL token/mint accounts legitimately appear as from/to
                      # (source/destination) pairs; passing the same one is a
                      # token-program concern, not the duplicate-mutable bug this
                      # rule targets. Only a program's own account types are
                      # duplicates here.
                      if inner_type in ("TokenAccount", "Mint"):
                          continue

                      # A field pinned by seeds, address, or an associated token
                      # derivation resolves to exactly one account, so it cannot
                      # be the duplicate of anything beside it.
                      #
                      # `token::mint`/`token::authority` are deliberately not
                      # here: they constrain what a token account holds, not
                      # which one it is, and many token accounts share them.
                      pinned = False
                      for pin in pins:
                          if pin.access_path.startswith(field_path + "."):
                              pinned = True
                              break
                      if pinned:
                          continue

                      # A key comparison on the field (a `require`/`if` guard, or
                      # an inline `constraint = a.key() != b.key()`) distinguishes
                      # the accounts.
                      if nodes.find_method_calls(field_name, "key"):
                          continue

                      by_type.setdefault(inner_type, []).append(account)

                  for inner_type, accounts in by_type.items():
                      if len(accounts) < 2:
                          continue
                      for account in accounts:
                          print(account.to_result())
      except:
          continue
