version: 0.2.0
author: forefy
accent: anchor
name: Type Cosplay
description: Type cosplay vulnerability occurs when a program fails to validate that an account is of the expected type, allowing malicious accounts to masquerade as legitimate program accounts.
severity: Low
certainty: Low
vulnerable_example: https://github.com/Auditware/radar/blob/main/api/tests/mocks/type_cosplay/bad/src/lib.rs
rule: |
  for source, nodes in ast:
      try:
          funcs = nodes.find_all_functions().exit_on_none()
          for func in funcs:
              # The bug: raw account bytes are deserialized into a type without
              # proving the account is actually of that type. Keyed on the
              # deserialization (`try_from_slice`/`try_deserialize`), not a plain
              # data borrow - zeroing an account's data when closing it
              # (`try_borrow_mut_data`) is a different operation entirely.
              #
              # `try_deserialize_unchecked` belongs in this list and not only in
              # the exemption below. It is the deserialization *without* the
              # discriminator comparison, so a function reaching for it is the
              # case this rule exists for — but being a distinct identifier it
              # never matched `try_deserialize`, so such a function did not
              # enter the rule at all. That is how Anchor's own
              # `InterfaceAccount::reload` went unreported: it pinned owner
              # stability and then re-deserialized unchecked, so an account
              # could come back as a different type after a CPI.
              reads_raw = func.find_by_names("try_from_slice", "try_deserialize")

              # `try_deserialize_unchecked` is the deserialization *without* the
              # discriminator comparison, and being a distinct identifier it
              # never matched above — so a function reaching for it did not
              # enter this rule at all. That is how Anchor's own
              # `InterfaceAccount::reload` went unreported: it pinned owner
              # stability and then re-deserialized unchecked, so an account
              # could come back as a different type after a CPI.
              #
              # Counted only when the result is written back into an account
              # that already exists (`set_inner`) — a refresh. Returning a
              # freshly constructed value from it is `try_from_unchecked`,
              # Anchor's deliberate unchecked constructor, which is present in
              # the patched source too; reporting that would fire on fixed and
              # vulnerable code alike and so distinguish nothing.
              if not reads_raw.nodes:
                  unchecked = func.find_by_names("try_deserialize_unchecked")
                  if unchecked.nodes and func.find_by_names("set_inner").nodes:
                      reads_raw = unchecked

              if not reads_raw.nodes:
                  continue

              # A type discriminant/discriminator check proves the type, and
              # Anchor's `Account::try_from` / `Account<T>` validates the account
              # discriminator for you.
              if func.find_by_names("discriminant", "discriminator").nodes:
                  continue
              if func.find_chained_calls("Account", "try_from").node_lists:
                  continue

              # `try_deserialize` reads the 8-byte discriminator and rejects a
              # mismatch — it is the check this rule is looking for, and the
              # normal way to write it in Anchor. `try_deserialize_unchecked`
              # is a distinct identifier and is deliberately not accepted here,
              # because it skips exactly that comparison.
              #
              # A hand-rolled `data[..8] == T::DISCRIMINATOR` counts too; code
              # that borrows raw bytes to inspect a version before deciding how
              # to parse them cannot go through `try_deserialize` at all.
              if func.find_by_names("try_deserialize", "DISCRIMINATOR"):
                  continue

              print(reads_raw.first().to_result())
      except:
          continue