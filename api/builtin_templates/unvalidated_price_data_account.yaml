version: 0.1.3
author: forefy
accent: anchor
name: Unvalidated Price Data Account
description: Reading oracle or price data from an untyped AccountInfo without validating the account owner can allow untrusted accounts to supply forged pricing data.
severity: High
certainty: Medium
rule: |
  for source, nodes in ast:
      try:
          # This rule is about oracle price accounts, so require the program to
          # actually deal with one. Without this it fired on any `try_borrow_data`
          # - reporting a High-severity price-oracle finding against programs
          # that have no oracle at all.
          oracle_terms = (
              "price", "oracle", "pyth", "switchboard", "chainlink",
              "aggregator", "feed", "quote", "spot", "twap",
          )
          has_oracle_context = False
          for candidate in nodes.find_by_access_path(""):
              ident = candidate.ident
              if ident is None:
                  continue
              lowered = ident.lower()
              for term in oracle_terms:
                  if term in lowered:
                      has_oracle_context = True
                      break
              if has_oracle_context:
                  break
          if not has_oracle_context:
              continue

          funcs = nodes.find_all_functions().exit_on_none()
          contexts = nodes.find_by_names("Context")

          for func in funcs:
              try:
                  borrow_nodes = func.find_by_names("try_borrow_data", "borrow_data").exit_on_none()
                  func.find_by_names("require_keys_eq", "require_eq").exit_on_value()
                  func.find_comparison_involving("owner").exit_on_value()

                  # `find_comparison_involving` sees binary operators, so it
                  # misses `info.owner.eq(&crate::ID)` — the same check written
                  # method-style, which is house style in some codebases and
                  # exactly as strong.
                  if func.find_chained_calls("owner", "eq"):
                      continue

                  # An Anchor constraint pins the account before the handler
                  # runs, and it is written on the struct rather than in the
                  # body, so nothing above can see it. `owner = ...` states the
                  # owner outright; `seeds`/`bump` forces the address to a PDA
                  # of this program, which the caller cannot substitute.
                  struct_name = None
                  for context in contexts:
                      if not context.access_path.startswith(func.access_path):
                          continue
                      if ".inputs[" not in context.access_path:
                          continue
                      for arg in context.find_by_access_path(".arguments.angle_bracketed.args[0]"):
                          struct_name = arg.ident
                          break
                      if struct_name is not None:
                          break

                  if struct_name is not None:
                      pinned = False
                      for candidate in nodes.find_by_names(struct_name):
                          if not candidate.access_path.endswith(".struct"):
                              continue
                          if candidate.find_by_names("owner", "seeds"):
                              pinned = True
                          break
                      if pinned:
                          continue

                  print(borrow_nodes.first().to_result())
              except:
                  continue
      except:
          continue
