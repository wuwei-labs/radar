version: 0.1.2
author: forefy
accent: anchor
name: Missing Token Mint Constraint
description: Anchor account structs that accept TokenAccount fields without token::mint constraints can allow wrong-mint token accounts to be passed into sensitive flows.
severity: Medium
certainty: Medium
rule: |
  for source, nodes in ast:
      try:
          nodes.find_by_names("TokenAccount").exit_on_none()
          # `mint` catches both `token::mint` and `associated_token::mint`.
          # Matching the attribute group instead would accept a field carrying
          # only `token::authority`, which pins who may sign and says nothing
          # about the mint — exactly the case this rule is for. `address` names
          # the account outright, which fixes its mint along with everything
          # else.
          constraints = nodes.find_macro_attribute_by_names("mint", "address")
          checks = nodes.find_by_names("require_keys_eq", "require_eq")
          comparisons = nodes.find_comparison_involving("mint")
          contexts = nodes.find_by_names("Context")

          for token_account_node in nodes.find_by_names("TokenAccount"):
              try:
                  if ".struct.fields.named[" not in token_account_node.access_path:
                      continue

                  # Walked by access path rather than by `.parent`: a field
                  # written `Box<Account<'info, TokenAccount>>` sits one node
                  # deeper than a bare `Account<'info, TokenAccount>`, so a
                  # fixed number of parent hops lands on the wrong node and
                  # every boxed token account gets reported.
                  struct_path = token_account_node.access_path.split(".fields.named[")[0]
                  if not struct_path.endswith(".struct"):
                      continue

                  is_accounts_struct = False
                  for group in nodes.find_chained_calls("derive", "Accounts"):
                      for derive_node in group:
                          if derive_node.access_path.startswith(struct_path + "."):
                              is_accounts_struct = True
                              break
                      if is_accounts_struct:
                          break
                  if not is_accounts_struct:
                      continue

                  # Scoped to this field. The trailing "." matters:
                  # `fields.named[1]` is a string prefix of `fields.named[10]`,
                  # so without a delimiter one field's constraints answer for
                  # another's.
                  field_path = token_account_node.access_path.split(".ty")[0] + "."

                  pinned = False
                  for constraint in constraints:
                      if constraint.access_path.startswith(field_path):
                          pinned = True
                          break
                  if pinned:
                      continue

                  # A token::mint constraint is the Anchor way, but a handler
                  # that checks the mint itself (require_keys_eq, or a
                  # comparison against the mint) is equally safe. Scoped to the
                  # struct and the handlers that take it, so one instruction's
                  # check does not excuse another's missing constraint.
                  struct_ident = None
                  for candidate in nodes.find_by_access_path(struct_path):
                      if candidate.access_path == struct_path:
                          struct_ident = candidate.ident
                          break

                  scopes = [struct_path]
                  if struct_ident is not None:
                      for context in contexts:
                          if ".inputs[" not in context.access_path:
                              continue
                          for arg in context.find_by_access_path(".arguments.angle_bracketed.args[0]"):
                              if arg.ident == struct_ident:
                                  scopes.append(context.access_path.split(".inputs[")[0])
                              break

                  manually_validated = False
                  for check in checks:
                      for scope in scopes:
                          if check.access_path.startswith(scope + "."):
                              manually_validated = True
                              break
                      if manually_validated:
                          break
                  if not manually_validated:
                      for comparison in comparisons:
                          for scope in scopes:
                              if comparison.access_path.startswith(scope + "."):
                                  manually_validated = True
                                  break
                          if manually_validated:
                              break
                  if manually_validated:
                      continue

                  print(token_account_node.to_result())
              except:
                  continue
      except:
          continue
